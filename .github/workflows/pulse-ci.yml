name: Pulse MVP checks

on:
  push:
    paths:
      - "cases/ai-agent/mvp/**"
      - ".github/workflows/pulse-ci.yml"
  pull_request:
    paths:
      - "cases/ai-agent/mvp/**"
      - ".github/workflows/pulse-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: cases/ai-agent/mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cases/ai-agent/mvp/requirements-api.txt
      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q .
      - name: Unit and API tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Static checks
        run: |
          ruff check --isolated --select E9,F63,F7,F82 .
          ruff check --isolated --select E9,F,I dataset tests/test_dataset.py
          ruff format --isolated --check dataset tests/test_dataset.py
          ruff check --isolated --select E9,F,I benchmark tests/test_benchmark_*.py
          ruff format --isolated --check benchmark tests/test_benchmark_*.py
          ruff check --isolated --select E9,F,I http_limits.py tests/test_http_limits.py tests/test_redaction_limits.py
          ruff format --isolated --check http_limits.py tests/test_http_limits.py tests/test_redaction_limits.py
          ruff check --isolated --select E9,F,I ticket_context.py context_pipeline.py context_eval.py tests/test_context*.py tests/test_dataset_review.py
          ruff format --isolated --check ticket_context.py context_pipeline.py context_eval.py tests/test_context*.py tests/test_dataset_review.py
          ruff check --isolated --select E9,F,I structured_context.py structured_eval.py tests/test_structured*.py
          ruff format --isolated --check structured_context.py structured_eval.py tests/test_structured*.py
          ruff check --isolated --select E9,F,I span_context.py span_eval.py tests/test_span*.py
          ruff format --isolated --check span_context.py span_eval.py tests/test_span*.py
          ruff check --isolated --select E9,F,I quote_candidates*.py tests/test_quote_candidates*.py
          ruff format --isolated --check quote_candidates*.py tests/test_quote_candidates*.py
          ruff check --isolated --select E9,F,I issue_status.py tests/test_active_issue.py
          ruff format --isolated --check issue_status.py tests/test_active_issue.py
          bandit -q -r . -x ./tests -ll
      - name: Validate committed dataset
        run: python -m dataset validate --directory datasets/pulse-synthetic-v1
      - name: Verify benchmark evidence
        run: python -m benchmark verify --directory benchmarks/pulse-synthetic-v1/holdout
      - name: Verify current contextual experiment evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          from benchmark.artifact_io import read_json, sha256
          from benchmark.protocol import DatasetReader, _load_frozen, verify_report
          root = Path("benchmarks/pulse-context-v2.3")
          reader = DatasetReader("datasets/pulse-independent-20261109/benchmark")
          config, _ = _load_frozen(reader, root / "calibration")
          for split in ("development", "validation", "holdout"):
              report = verify_report(root / split)
              assert report["source_matches_current"], report
              assert report["configuration_sha256"] == config["configuration_sha256"]
              receipt = read_json(root / "calibration" / f"{split}-receipt.json")
              assert receipt == {
                  "status": "completed",
                  "configuration_sha256": config["configuration_sha256"],
                  "report_manifest_sha256": sha256((root / split / "manifest.json").read_bytes()),
              }, receipt
              print(split, report)
          PY
      - name: Verify structured extraction experiment evidence
        run: |
          python -m structured_eval verify \
            --reference datasets/pulse-synthetic-v1 \
            --holdout datasets/pulse-structured-holdout-v1 \
            --output benchmarks/pulse-structured-context-v1.1
      - name: Verify fragment extraction and normalization evidence
        run: |
          python -m span_eval verify \
            --reference datasets/pulse-synthetic-v1 \
            --holdout datasets/pulse-span-holdout-v1 \
            --output benchmarks/pulse-span-context-v1
      - name: Verify quote candidate search evidence
        run: |
          python -m quote_candidates_eval verify \
            --dataset datasets/pulse-quote-search-v1 \
            --output benchmarks/pulse-quote-candidates-v1
      - name: Verify independent control reproducibility
        run: |
          python datasets/pulse-independent-20261109/generate_dataset.py --check datasets/pulse-independent-20261109/benchmark
          pulse_repro_dir=$(mktemp -d)
          cp datasets/pulse-independent-20261109/generate_dataset.py "$pulse_repro_dir/"
          cp -R datasets/pulse-independent-20261109/source_snapshots "$pulse_repro_dir/"
          python "$pulse_repro_dir/generate_dataset.py" --verify-reproducible
          python "$pulse_repro_dir/generate_dataset.py" --check "$pulse_repro_dir/benchmark"
      - name: Audit dependencies
        run: pip-audit -r requirements-api.txt -r requirements-dev.txt
