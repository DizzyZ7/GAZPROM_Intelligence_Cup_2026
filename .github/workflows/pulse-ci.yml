name: Pulse MVP checks

on:
  push:
    paths:
      - "cases/ai-agent/mvp/**"
      - ".github/workflows/pulse-ci.yml"
  pull_request:
    paths:
      - "cases/ai-agent/mvp/**"
      - ".github/workflows/pulse-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: cases/ai-agent/mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cases/ai-agent/mvp/requirements-api.txt
      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q .
      - name: Unit and API tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Static checks
        run: |
          ruff check --isolated --select E9,F63,F7,F82 .
          ruff check --isolated --select E9,F,I dataset tests/test_dataset.py
          ruff format --isolated --check dataset tests/test_dataset.py
          ruff check --isolated --select E9,F,I benchmark tests/test_benchmark_*.py
          ruff format --isolated --check benchmark tests/test_benchmark_*.py
          ruff check --isolated --select E9,F,I cluster_identity.py context_eval.py pipeline.py service.py ticket_context.py tests/test_context*.py
          ruff format --isolated --check cluster_identity.py context_eval.py pipeline.py service.py ticket_context.py tests/test_context*.py
          bandit -q -r . -x ./tests -ll
      - name: Validate committed dataset
        run: python -m dataset validate --directory datasets/pulse-synthetic-v1
      - name: Verify benchmark evidence
        run: python -m benchmark verify --directory benchmarks/pulse-synthetic-v1/holdout
      - name: Verify contextual evaluation evidence
        run: python -m context_eval verify --dataset datasets/pulse-context-holdout-v1 --output benchmarks/pulse-context-holdout-v1/holdout
      - name: Verify historical contextual development and validation evidence
        run: |
          for split in development validation
          do
            python -m context_eval verify --dataset datasets/pulse-synthetic-v1 --output "benchmarks/pulse-context-v2/$split"
          done
      - name: Verify contextual development and validation evidence
        run: |
          for split in development validation
          do
            verification=$(python -m context_eval verify --dataset datasets/pulse-synthetic-v1 --output "benchmarks/pulse-context-v2.2/$split")
            printf '%s\n' "$verification"
            printf '%s\n' "$verification" | python -c 'import json, sys; assert json.load(sys.stdin)["source_matches_current"]'
          done
      - name: Audit runtime dependencies
        run: pip-audit -r requirements-api.txt
